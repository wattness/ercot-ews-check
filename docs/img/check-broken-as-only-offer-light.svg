<svg xmlns="http://www.w3.org/2000/svg" width="771" height="512" viewBox="0 0 771 512">
<title>ercot-ews-check check examples/broken/as-only-offer.xml</title>
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #1f2328; }
.prompt { fill: #59636e; }
.error { fill: #d1242f; }
</style>
<rect x="0.5" y="0.5" width="770" height="511" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
<text xml:space="preserve"><tspan x="16" y="31" textLength="8.4" class="prompt">$</tspan><tspan x="24.4" y="31" textLength="470.4"> ercot-ews-check check examples/broken/as-only-offer.xml</tspan></text>
<text xml:space="preserve"><tspan x="16" y="51" textLength="604.8">examples/broken/as-only-offer.xml: BLOCKED: schema invalid, 5 finding(s)</tspan></text>
<text xml:space="preserve"><tspan x="16" y="71" textLength="16.8">  </tspan><tspan x="32.8" y="71" textLength="58.8" class="error">[error]</tspan><tspan x="91.6" y="71" textLength="663.6"> schema at /BidSet/ASOnlyOffer/ASOnlyPriceCurve: &lt;xvalue&gt; is not an element of </tspan><tspan x="16" y="91" textLength="705.6">&lt;ASOnlyPriceCurve&gt;, and &lt;ASOnlyPriceCurve&gt; is missing &lt;CurveData&gt;, which the schema </tspan><tspan x="16" y="111" textLength="218.4">requires at this position.</tspan></text>
<text xml:space="preserve"><tspan x="16" y="131" textLength="730.8">      fix: Add &lt;CurveData&gt;; remove &lt;xvalue&gt; or move it to where the schema declares it.</tspan></text>
<text xml:space="preserve"><tspan x="16" y="151" textLength="126">      see: D001</tspan></text>
<text xml:space="preserve"><tspan x="16" y="171" textLength="16.8">  </tspan><tspan x="32.8" y="171" textLength="58.8" class="error">[error]</tspan><tspan x="91.6" y="171" textLength="663.6"> schema at /BidSet/ASOnlyOffer/ASOnlyPriceCurve: &lt;yvalue&gt; is not an element of </tspan><tspan x="16" y="191" textLength="588">&lt;ASOnlyPriceCurve&gt;. Allowed here: &lt;startTime&gt;, &lt;endTime&gt;, &lt;CurveData&gt;.</tspan></text>
<text xml:space="preserve"><tspan x="16" y="211" textLength="655.2">      fix: Remove &lt;yvalue&gt; or replace it with the element the schema declares.</tspan></text>
<text xml:space="preserve"><tspan x="16" y="231" textLength="126">      see: D001</tspan></text>
<text xml:space="preserve"><tspan x="16" y="251" textLength="16.8">  </tspan><tspan x="32.8" y="251" textLength="58.8" class="error">[error]</tspan><tspan x="91.6" y="251" textLength="630"> missing-required-field at ASOnlyOffer: ASOnlyOffer lacks 2 field(s) ERCOT </tspan><tspan x="16" y="271" textLength="554.4">marks required (Y) or key (K): ASOnlyPriceCurve/CurveData/xvalue, </tspan><tspan x="16" y="291" textLength="722.4">ASOnlyPriceCurve/CurveData/y1value. The XSD cannot catch this: every payload field is </tspan><tspan x="16" y="311" textLength="100.8">minOccurs=0.</tspan></text>
<text xml:space="preserve"><tspan x="16" y="331" textLength="277.2">      fix: Add the fields listed.</tspan></text>
<text xml:space="preserve"><tspan x="16" y="351" textLength="126">      see: D007</tspan></text>
<text xml:space="preserve"><tspan x="16" y="371" textLength="16.8">  </tspan><tspan x="32.8" y="371" textLength="58.8" class="error">[error]</tspan><tspan x="91.6" y="371" textLength="630"> trade-date-mismatch at ASOnlyOffer: BidSet tradingDate is 2026-10-16, but </tspan><tspan x="16" y="391" textLength="722.4">ASOnlyOffer starts at 2026-10-15T00:00:00-05:00, which falls on 2026-10-15 in Central </tspan><tspan x="16" y="411" textLength="663.6">time. The ASOnlyOffer table states: "Valid start hour boundary for trade date".</tspan></text>
<text xml:space="preserve"><tspan x="16" y="431" textLength="655.2">      fix: Derive tradingDate from the payload's startTime in America/Chicago.</tspan></text>
<text xml:space="preserve"><tspan x="16" y="451" textLength="16.8">  </tspan><tspan x="32.8" y="451" textLength="58.8" class="error">[error]</tspan><tspan x="91.6" y="451" textLength="621.6"> hour-24 at endTime: endTime is 2026-10-15T24:00:00-05:00; ERCOT excludes </tspan><tspan x="16" y="471" textLength="310.8">24:00 although xs:dateTime allows it.</tspan></text>
<text xml:space="preserve"><tspan x="16" y="491" textLength="369.6">      fix: Write 00:00 on the following day.</tspan></text>
</svg>
