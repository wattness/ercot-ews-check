<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1584" viewBox="0 0 960 1584" role="img" aria-labelledby="title desc">
<title id="title">How a bid travels through ERCOT's External Web Services</title>
<desc id="desc">A QSE's Market Participant System sends a signed SOAP envelope over HTTPS with mutual authentication; its Body holds a RequestMessage whose Payload is a BidSet. ERCOT's Nodal External Interface runs Phase Zero validation and replies at once with a ResponseMessage giving each bid SUBMITTED and an mRID. The MMS runs Phase One validation; a Notify to the QSE's listener reports each bid ACCEPTED, PENDING or ERRORS, and the listener answers with an Acknowledge. At 07:00 CT the day before the Operating Day the MMS runs Phase Two validation and notifies the bids it cancels in a P2ValidationSet. After the close of the market, awards are notified in an AwardSet. Get Notifications fetches notifications already sent. Unofficial; not affiliated with or endorsed by ERCOT.</desc>
