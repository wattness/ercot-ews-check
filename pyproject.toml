[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ercot-ews-check"
version = "0.2.0"
description = "Check ERCOT EWS submissions against ERCOT's schemas and published rules, and look up known discrepancies in ERCOT's EWS documentation. Unofficial; not affiliated with or endorsed by ERCOT."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Wattness" }]
keywords = ["ercot", "ews", "xsd", "bidset", "energy-markets", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "xmlschema>=3.0",
    "PyYAML>=6.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.16,<0.17"]

[project.scripts]
ercot-ews-check = "ercot_ews_check.cli:main"

[project.urls]
Issues = "https://github.com/wattness/ercot-ews-check/issues"
Source = "https://github.com/wattness/ercot-ews-check"

[tool.hatch.build.targets.wheel]
packages = ["src/ercot_ews_check"]

[tool.hatch.build.targets.wheel.force-include]
"vendor" = "ercot_ews_check/_data/vendor"
"discrepancies" = "ercot_ews_check/_data/discrepancies"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "vendor",
    "discrepancies",
    "docs",
    "examples",
    "scripts",
    "skills",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CONTRIBUTING.md",
    "AGENTS.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: needs the internet; skipped unless --network is given"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["ercot_ews_check"]
known-local-folder = ["helpers"]
