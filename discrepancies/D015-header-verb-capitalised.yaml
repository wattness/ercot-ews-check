id: D015
slug: header-verb-capitalised
title: Several request tables give Header/Verb capitalised (Get, Change, Cancel, Reply, Created); the
  enumeration is lower case
kind: enumeration-value
resolution: schema-wins
status: open
ercot_says:
  page: Utility Interface Messages / Get SASM ID List; Outage Scheduling Messages / Outage Update, Outage
    Cancellation, Outage Query; Change Active Notification URL; Confirmed and Unconfirmed Trades
  location: request and response tables
  quote: Header/Verb Get Header/Noun SASMIDList
  url: https://developer.ercot.com/applications/ews/Utility%20Interface%20Messages/Get%20SASM%20ID%20List/
schema_says:
  file: Message.xsd
  line: 77
  rule: 'HeaderType/Verb is an enumeration of fifteen lower-case values: cancel, canceled, change, changed,
    create, created, close, closed, delete, deleted, get, reply, submit, update, updated.'
do: Write the verb in lower case.
lookup:
  messages:
  - RequestMessage
  - OutageSet
  elements:
  - Verb
  - Header
  values:
  - Get
  - Change
  - Cancel
  - Reply
  - Created
  - get
  - change
  endpoints:
  - Outage Scheduling Service
  - Utility Interface
