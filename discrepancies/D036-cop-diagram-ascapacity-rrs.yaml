id: D036
slug: cop-diagram-ascapacity-rrs
title: The COP diagram expands ASCapacity with rrs and no ecrs; the schema has rrsPF, rrsFF, rrsUF and ecrs
kind: element-name
resolution: schema-wins
status: open
ercot_says:
  page: Market Transaction Messages / Current Operating Plan (COP)
  location: diagram (COP_Structure.png)
  quote: ASCapacity ... regUp ... regDown ... rrs ... nonSpin
  observed: Inside the COP diagram, ASCapacity expands to startTime, endTime, regUp, regDown, rrs and
    nonSpin, and ends there. The same page's ASCapacity diagram (ASCapacity_Structure.png) and its
    Message Element table give rrsPF, rrsFF, rrsUF and ecrs.
  url: https://developer.ercot.com/applications/ews/Market%20Transaction%20Messages/Current%20Operating%20Plan%20%28COP%29/
schema_says:
  file: ErcotTransactionTypes.xsd
  line: 187
  rule: ASCapacity is startTime, endTime, regUp, regDown, rrsPF, rrsFF, rrsUF, nonSpin and ecrs. The
    comment on the line above rrsPF records that NPRR863 removed rrs; no schema declares it.
do: Send rrsPF, rrsFF and rrsUF in place of rrs, and ecrs after nonSpin. Build ASCapacity from the page's
  separate ASCapacity diagram or its table, not from the COP diagram.
lookup:
  products:
  - COP
  messages:
  - BidSet
  elements:
  - ASCapacity
  - rrs
  - ecrs
  endpoints:
  - Market Transaction Service
