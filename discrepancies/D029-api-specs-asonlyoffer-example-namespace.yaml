id: D029
slug: api-specs-asonlyoffer-example-namespace
title: api-specs ews/examples/ASOnlyOffer-Example.xml puts BidSet in the message namespace
kind: namespace
resolution: schema-wins
status: open
ercot_says:
  page: 'github.com/ercot/api-specs: ews/examples/ASOnlyOffer-Example.xml'
  location: lines 6 and 20-21
  quote: <RequestMessage xmlns="http://www.ercot.com/schema/2007-06/nodal/ews/message"> ... <Payload>
    <BidSet>
  observed: BidSet declares no namespace, so it takes the message namespace declared on RequestMessage.
  url: https://github.com/ercot/api-specs/blob/7e785be50f0b0e5462f7d0e700ba82289f25390e/ews/examples/ASOnlyOffer-Example.xml
schema_says:
  file: Message.xsd
  line: 57
  rule: Payload holds xsd:any namespace="##other", which excludes the message namespace. BidSet belongs
    to http://www.ercot.com/schema/2007-06/nodal/ews.
do: Declare xmlns="http://www.ercot.com/schema/2007-06/nodal/ews" on BidSet (or use a prefix bound to
  it).
lookup:
  products:
  - ASOnlyOffer
  messages:
  - RequestMessage
  - BidSet
  elements:
  - Payload
  - BidSet
  endpoints:
  - Market Transaction Service
