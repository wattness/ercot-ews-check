id: D002
slug: aso-table-pricecurve-container
title: ASO table puts startTime and endTime under PriceCurve; ASOffer's curve element is ASPriceCurve
kind: element-path
resolution: schema-wins
status: open
ercot_says:
  page: Market Transaction Messages / Ancillary Service Offer (ASO)
  location: Message Element table
  quote: PriceCurve/startTime Y dateTime Start time for curve Valid hour boundary PriceCurve/endTime Y
    dateTime
  url: https://developer.ercot.com/applications/ews/Market%20Transaction%20Messages/Ancillary%20Service%20Offer%20%28ASO%29/
schema_says:
  file: ErcotTransactionTypes.xsd
  line: 360
  rule: ASOffer declares ASPriceCurve. PriceCurve is a different element, used by EnergyBid and RTMEnergyBid;
    the same table's other rows already say ASPriceCurve.
do: Put startTime and endTime inside ASPriceCurve.
lookup:
  products:
  - ASOffer
  messages:
  - BidSet
  elements:
  - ASPriceCurve
  - PriceCurve
  - startTime
  - endTime
  endpoints:
  - Market Transaction Service
