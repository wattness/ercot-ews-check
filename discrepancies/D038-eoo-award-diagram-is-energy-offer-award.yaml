id: D038
slug: eoo-award-diagram-is-energy-offer-award
title: The Energy-Only Offer award pages show the AwardedEnergyOffer diagram (resource, startType,
  combinedCycleName); AwardedEnergyOnlyOffer holds awardedMWh, spp, bidId and sp
kind: element-path
resolution: schema-wins
status: open
ercot_says:
  page: Market Information Messages / AwardedEnergyOnlyOffer; Notifications Messages / DAM Energy-Only
    Offer Awards
  location: diagram (AwardedEnergyOnlyOffer_Structure.png)
  quote: AwardedEnergyOffer ... EnergyAward Offer ... resource ... awardedMWh ... startType ...
    combinedCycleName
  observed: Both pages present this image as the AwardedEnergyOnlyOffer structure. Its root is labelled
    AwardedEnergyOffer, and after the Award fields it draws resource, awardedMWh, startType and
    combinedCycleName, with no spp, bidId or sp. The Market Information page's own table and XML example
    list awardedMWh, spp, bidId and sp.
  url: https://developer.ercot.com/applications/ews/Market%20Information%20Messages/AwardedEnergyOnlyOffer/
schema_says:
  file: ErcotAwardTypes.xsd
  line: 180
  rule: AwardedEnergyOnlyOffer extends Award with awardedMWh, spp (optional), bidId and sp. resource,
    startType and combinedCycleName belong to AwardedEnergyOffer (line 108), the Energy Offer award.
do: Read an Energy-Only Offer award as the Award fields followed by awardedMWh, spp, bidId and sp; expect
  no resource, startType or combinedCycleName.
lookup:
  products:
  - EnergyOnlyOffer
  messages:
  - AwardSet
  elements:
  - AwardedEnergyOnlyOffer
  - resource
  - startType
  - combinedCycleName
  endpoints:
  - Market Information Service
  - Notifications
