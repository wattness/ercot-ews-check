probes:
  portal:
    page: Market%20Information%20Messages/AwardedEnergyOnlyOffer
    text: An AwardedEnergyOnlyOffer is returned in the payload of the ResponseMessage using the following
      structure
  diagram:
    path: developer.ercot.com/applications/ews/Images/AwardedEnergyOnlyOffer_Structure.png
    sha256: 413352cc60dabf6a750542c011fd52cb14d28f9776f3cc8888a0be344a7662d7
  schema:
    file: ErcotAwardTypes.xsd
    pattern: <xs:complexType name="AwardedEnergyOnlyOffer">
notes: The Energy Offer award pages' own diagram (AwardedEnergyOffer_Structure.png) draws the same
  structure. AwardedEnergyOnlyOffer's fields are the same as AwardedEnergyBid's, which the DAM Energy Bid
  award diagram (AwardedEnergyBid_Structure.png) draws.
