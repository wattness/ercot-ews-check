id: D011
slug: status-error-singular
title: Rejected-bid samples write <status>ERROR</status>; the enumeration has ERRORS
kind: enumeration-value
resolution: schema-wins
status: open
ercot_says:
  page: Notifications Messages / Offer and Bid Set Errors; Market Transaction Service
  location: XML examples of rejected bids
  quote: <status>ERROR</status>
  url: https://developer.ercot.com/applications/ews/Notifications%20Messages/Offer%20and%20Bid%20Set%20Errors/
schema_says:
  file: ErcotCommonTypes.xsd
  line: 310
  rule: TransactionStatusType enumerates SUBMITTED, ACCEPTED, PENDING, REJECTED, ERRORS, UNCONFIRMED,
    CANCELED and ACKNOWLEDGED. There is no ERROR.
do: When reading replies and notifications, treat ERROR, ERRORS and REJECTED alike rather than discard
  the message. Never write ERROR.
