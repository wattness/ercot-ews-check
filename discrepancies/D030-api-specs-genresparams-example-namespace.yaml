id: D030
slug: api-specs-genresparams-example-namespace
title: api-specs ews/examples/GenResParams-SOC-Example.xml leaves ReplayDetection, Payload and ResParametersSet
  in no namespace
kind: namespace
resolution: schema-wins
status: open
ercot_says:
  page: 'github.com/ercot/api-specs: ews/examples/GenResParams-SOC-Example.xml'
  location: lines 9-10 and 19-20
  quote: <ReplayDetection> <Nonce>1359652204</Nonce> ... <Payload> <ResParametersSet>
  observed: These elements are unprefixed and no default namespace is in scope, so they are in no namespace.
  url: https://github.com/ercot/api-specs/blob/7e785be50f0b0e5462f7d0e700ba82289f25390e/ews/examples/GenResParams-SOC-Example.xml
schema_says:
  file: Message.xsd
  line: 64
  rule: 'Message.xsd and ErcotTransactions.xsd are elementFormDefault qualified: ReplayDetection, Nonce,
    Created and Payload belong to the message namespace, ResParametersSet to the ews namespace.'
do: 'Qualify every element: the header children with the message namespace, the payload with the ews namespace.'
lookup:
  messages:
  - RequestMessage
  - ResParametersSet
  elements:
  - ReplayDetection
  - Payload
  - ResParametersSet
  - GenResourceParameters
  - SOC
  endpoints:
  - Resource Parameter Transaction Service
reproducer:
  invalid: |
    <ns0:RequestMessage xmlns:ns0="http://www.ercot.com/schema/2007-06/nodal/ews/message">
      <ns0:Header>
        <ns0:Verb>create</ns0:Verb>
        <ns0:Noun>ResParametersSet</ns0:Noun>
        <ReplayDetection>
          <Nonce>1359652204</Nonce>
          <Created>2026-10-14T09:00:00-05:00</Created>
        </ReplayDetection>
        <ns0:Revision>001</ns0:Revision>
        <ns0:Source>QSE1</ns0:Source>
      </ns0:Header>
    </ns0:RequestMessage>
  valid: |
    <ns0:RequestMessage xmlns:ns0="http://www.ercot.com/schema/2007-06/nodal/ews/message">
      <ns0:Header>
        <ns0:Verb>create</ns0:Verb>
        <ns0:Noun>ResParametersSet</ns0:Noun>
        <ns0:ReplayDetection>
          <ns0:Nonce>1359652204</ns0:Nonce>
          <ns0:Created>2026-10-14T09:00:00-05:00</ns0:Created>
        </ns0:ReplayDetection>
        <ns0:Revision>001</ns0:Revision>
        <ns0:Source>QSE1</ns0:Source>
      </ns0:Header>
    </ns0:RequestMessage>
probes:
  file:
    path: api-specs/ews/examples/GenResParams-SOC-Example.xml
    sha256: 8d7cb416f442795655f7590f070faf8033b50d385b5e9e6eaf1e79479a15e8eb
  schema:
    file: Message.xsd
    pattern: name="ReplayDetectionType">\s*<xsd:sequence>\s*<xsd:element name="Nonce"
reported:
- https://github.com/ercot/api-specs/pull/148
notes: Proposed upstream together with D029; closed without merging on 2026-10-06.
