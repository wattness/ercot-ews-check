id: D044
slug: sog-price-correction-diagram-float
title: The SOTG/SODG 15-minute price correction diagram types PriceOriginal and PriceCorrected xs:float;
  the schema types them xs:decimal
kind: value-format
resolution: schema-wins
status: open
ercot_says:
  page: Market Information Messages / Price Corrected SOTG/SODG 15-min Prices
  location: diagram (RTMPriceCorrectionSOGPRICE_Structure.png)
  quote: PriceOriginal Type xs:float ... PriceCorrected Type xs:float
  observed: Of the ten children drawn, PriceOriginal and PriceCorrected are typed xs:float; every other
    drawn type matches the schema.
  url: https://developer.ercot.com/applications/ews/Market%20Information%20Messages/Price%20Corrected%20SOTG_SODG%2015-min%20Prices/
schema_says:
  file: ErcotInformationTypes.xsd
  line: 408
  rule: RTMPriceCorrectionSOGPRICE declares PriceOriginal and PriceCorrected as xs:decimal (lines 408 and
    409). xs:decimal has no exponent form, INF or NaN.
do: Read both prices as decimals rather than binary floating point; a value in exponent form does not
  validate.
lookup:
  messages:
  - RTMPriceCorrectionSOGPRICES
  elements:
  - PriceOriginal
  - PriceCorrected
  endpoints:
  - Market Information Service
