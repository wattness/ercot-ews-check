id: D014
slug: appendix-d-replaydetection
title: Appendix D's ReplayDetection has Created before Nonce, in the wsu and wsse namespaces
kind: element-order
resolution: schema-wins
status: open
ercot_says:
  page: 'Appendices / Appendix D: Annotated SOAP Message'
  location: annotated envelope, section 8
  quote: <msg:ReplayDetection> <wsu:Created> 2006-11-29T20:05:55.022Z </wsu:Created> <wsse:Nonce EncodingType="#Base64Binary">
  url: https://developer.ercot.com/applications/ews/Appendices/Appendix%20D_%20Annotated%20SOAP%20Message/
schema_says:
  file: Message.xsd
  line: 64
  rule: ReplayDetectionType is a sequence of Nonce then Created, both declared locally in the message
    namespace (elementFormDefault qualified).
do: Write msg:Nonce, then msg:Created, both in the message namespace. Appendix E, Appendix H and the service
  pages already do.
lookup:
  messages:
  - RequestMessage
  elements:
  - ReplayDetection
  - Nonce
  - Created
  endpoints:
  - Market Transaction Service
  - Market Information Service
