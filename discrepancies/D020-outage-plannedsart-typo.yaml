id: D020
slug: outage-plannedsart-typo
title: Outage Creation and Outage Update tables spell Schedule/plannedSart
kind: element-name
resolution: schema-wins
status: open
ercot_says:
  page: Outage Scheduling Messages / Outage Creation; Outage Update
  location: Message Element tables
  quote: Schedule/ plannedSart N dateTime This is the date/time at which the Outage is planned to start.
  url: https://developer.ercot.com/applications/ews/Outage%20Scheduling%20Messages/Outage%20Creation/
schema_says:
  file: ErcotOutageTypes.xsd
  line: 182
  rule: The schema declares plannedStart (also new_plannedStart, plannedStartFrom, plannedStartTo). plannedSart
    appears in no schema.
do: Write plannedStart.
lookup:
  messages:
  - OutageSet
  elements:
  - plannedStart
  - plannedSart
  - Schedule
  endpoints:
  - Outage Scheduling Service
