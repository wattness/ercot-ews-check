schema_says:
  file: ErcotCommonTypes.xsd
  line: 78
  rule: 'The change note for version 0.3.33 (03/05/2025) says "Non-Spin is used for ASOnlyOffer submission
    rather than On-Non-Spin", and the AS Only Offer page limits the offer to Reg-Up, Reg-Down, Non-Spin,
    RRSPF and ECRSS. On-Non-Spin is in the ASType enumeration, so the XSD accepts the example.'
do: Write <asType>Non-Spin</asType> in an AS Only Offer.
