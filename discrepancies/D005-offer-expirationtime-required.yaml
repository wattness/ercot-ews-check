id: D005
slug: offer-expirationtime-required
title: expirationTime is drawn as the one required field of ASOffer; the schema makes it optional
kind: required-field
resolution: prose-wins
status: open
ercot_says:
  page: Market Transaction Messages / Ancillary Service Offer (ASO)
  location: structure diagram (ASOffer_Structure.png)
  observed: expirationTime is the only solid (required) box; every sibling is dashed (optional).
  url: https://developer.ercot.com/applications/ews/Market%20Transaction%20Messages/Ancillary%20Service%20Offer%20%28ASO%29/
schema_says:
  file: ErcotTransactionTypes.xsd
  line: 276
  rule: expirationTime is minOccurs="0" on Offer and EnergyBid, like every other payload field.
do: Always send expirationTime on ASOffer, EnergyOnlyOffer and EnergyBid. The EOO and EB tables also mark
  it Y.
lookup:
  products:
  - ASOffer
  - EnergyOnlyOffer
  - EnergyBid
  messages:
  - BidSet
  elements:
  - expirationTime
  endpoints:
  - Market Transaction Service
