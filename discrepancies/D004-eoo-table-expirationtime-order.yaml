      <tradingDate>2026-10-15</tradingDate>
      <EnergyOnlyOffer>
        <startTime>2026-10-15T00:00:00-05:00</startTime>
        <endTime>2026-10-16T00:00:00-05:00</endTime>
        <sp>HB_HOUSTON</sp>
        <bidID>eoo01</bidID>
        <expirationTime>2026-10-14T09:00:00-05:00</expirationTime>
        <EnergyOfferCurve>
          <startTime>2026-10-15T17:00:00-05:00</startTime>
          <endTime>2026-10-15T18:00:00-05:00</endTime>
          <curveStyle>CURVE</curveStyle>
          <CurveData>
            <xvalue>5.0</xvalue>
            <y1value>20.00</y1value>
          </CurveData>
          <CurveData>
            <xvalue>10.0</xvalue>
            <y1value>35.50</y1value>
          </CurveData>
        </EnergyOfferCurve>
      </EnergyOnlyOffer>
    </BidSet>
  valid: |
