id: D004
slug: eoo-table-expirationtime-order
title: EOO table lists expirationTime after sp and bidID; the schema requires it before them
kind: element-order
resolution: schema-wins
status: open
ercot_says:
  page: Market Transaction Messages / DAM Energy-Only Offer (EOO)
  location: Message Element table (the 1 after bidID is a footnote marker)
  quote: sp K string Settlement point ... bidID 1 K string Bid ID ... expirationTime Y dateTime Time of
    offer expiration
  url: https://developer.ercot.com/applications/ews/Market%20Transaction%20Messages/DAM%20Energy-Only%20Offer%20%28EOO%29/
schema_says:
  file: ErcotTransactionTypes.xsd
  line: 636
  rule: EnergyOnlyOffer extends Offer, which extends Bid. An extension appends to its base's sequence,
    so Offer's expirationTime comes before EnergyOnlyOffer's sp and bidID.
do: Order the children startTime, endTime, expirationTime, sp, bidID, then the curves.
lookup:
  products:
  - EnergyOnlyOffer
  messages:
  - BidSet
  elements:
  - expirationTime
  - sp
  - bidID
  endpoints:
  - Market Transaction Service
reproducer:
