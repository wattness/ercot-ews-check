id: D031
slug: appendix-h-malformed-ending
title: Appendix H's spring-forward example has TmPoint/ending 2011-03-13T01400:00-05:00
kind: value-format
resolution: schema-wins
status: open
ercot_says:
  page: 'Appendices / Appendix H: DST XML Examples'
  location: ASObligations example, spring-forward day
  quote: <ns1:ending>2011-03-13T01400:00-05:00</ns1:ending>
  url: https://developer.ercot.com/applications/ews/Appendices/Appendix%20H_%20DST%20XML%20Examples/
schema_says:
  file: ErcotCommonTypes.xsd
  line: 899
  rule: TmPoint/ending is xs:dateTime; '01400' is not an hour.
do: On the spring-forward day, the hour after 01:00-02:00 CST starts at 03:00 CDT; write ending as a valid
  dateTime such as 2011-03-13T04:00:00-05:00.
